name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compares the dependency changes in a pull request against the GitHub Advisory
  # Database and fails the check when a change introduces a high-severity advisory.
  # Requires the repository setting "Dependency graph" to be enabled; when it is
  # disabled the action reports a configuration error instead of reviewing the graph.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Resolves the real dependency graph so the report reflects shipped versions.
      - name: Resolve dependency graph
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath

      - name: Save dependency report
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt

      - name: Archive dependency report
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependency-report
          path: dependencies.txt
          retention-days: 30

      # Publishes the graph for Dependabot vulnerability alerts. This requires the
      # repository setting "Dependency graph" to be enabled by an owner; it is
      # currently disabled, so the step is advisory and must not fail the build.
      - name: Submit dependency graph (advisory)
        continue-on-error: true
        uses: gradle/actions/dependency-submission@v4

      - name: Report dependency graph availability
        run: |
          echo "::notice::Automated vulnerability alerts require Settings > Code security > Dependency graph to be enabled by a repository owner."
