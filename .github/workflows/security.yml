name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves the real dependency graph and publishes it, so Dependabot can raise
  # vulnerability alerts for the exact versions this project builds against.
  dependency-graph:
    name: Dependency graph and report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/dependency-submission@v4
      - name: Upload resolved dependency report
        if: ${{ !cancelled() }}
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gradle-dependency-report
          path: dependencies.txt
          retention-days: 14
