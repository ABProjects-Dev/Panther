name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-vulnerability-check:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Resolve real dependency versions so the scanner inspects the actual graph.
      - name: Resolve dependency classpath
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --stacktrace
      - name: OWASP Dependency-Check
        uses: dependency-check/DependencyCheck@v13.0.0
        with:
          project: Panther
          scan: app
          format: SARIF
          out: reports
          args: >-
            --failOnCVSS 7
      - name: Upload SARIF report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-sarif
          path: reports/dependency-check-report.sarif
          if-no-files-found: warn
          retention-days: 7
      - name: Publish SARIF to code scanning
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif
