name: Build Release Candidate

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-candidate:
    name: Build release APK (unsigned candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble release candidate
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload release candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: panther-release-candidate-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify APK metadata
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -n 1)
          "$AAPT" dump badging "$APK_PATH" | grep -E "package:|versionCode:|versionName:"
