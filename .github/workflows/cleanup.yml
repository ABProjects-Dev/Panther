name: Cleanup Old Artifacts

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete artifacts older than retention window
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep in sync with the longest retention-days used by any workflow
      # (release.yml uses 30) so published release artifacts are never deleted early.
      RETENTION_HOURS: '720'
    steps:
      - name: Delete eligible artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const retentionHours = Number(process.env.RETENTION_HOURS);
            const cutoff = Date.now() - retentionHours * 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            let deleted = 0;
            for (const artifact of artifacts) {
              // Never delete artifacts that belong to an official release.
              if (artifact.name.startsWith('panther-official-release-')) {
                core.info(`Skipping release artifact: ${artifact.name}`);
                continue;
              }
              if (!artifact.expired && Date.parse(artifact.created_at) <= cutoff) {
                core.info(`Deleting ${artifact.name} (id ${artifact.id}, created ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                deleted++;
              }
            }
            core.info(`Deleted ${deleted} artifact(s).`);
