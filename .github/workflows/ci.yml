name: CI - Build, Test, Lint

on:
  # Owner rule (AGENTS.md section 19.1): CI runs only after a pull request is
  # opened. Pushes to main and manual dispatch do not start a run, because the
  # pull request already validated the same commit and a second run would be
  # duplicate work.
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # ubuntu-latest runners ship the Android SDK (platform 36 is present), so no
      # setup-android step is required; adding one previously failed the job.
      - name: Run unit tests, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: panther-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      # Publish the JUnit counts into the job summary for a quick, auditable signal.
      - name: Summarise unit test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, os
          rows, total = [], dict(tests=0, failures=0, errors=0, skipped=0)
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              r = ET.parse(f).getroot()
              d = {k: int(r.get(k, 0)) for k in total}
              for k in total:
                  total[k] += d[k]
              rows.append(f"| {r.get('name')} | {d['tests']} | {d['failures']} | {d['errors']} | {d['skipped']} |")
          out = ["### Unit test results", "", "| Suite | Tests | Failures | Errors | Skipped |", "| --- | --- | --- | --- | --- |"] + rows
          out += ["", f"**Total: {total['tests']} tests, {total['failures']} failures, {total['errors']} errors, {total['skipped']} skipped**"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          print("\n".join(out))
          # Also surfaced as an annotation so the counts are readable from the API.
          print(f"::notice::unit tests executed: {total['tests']} total, {total['failures']} failures, {total['errors']} errors, {total['skipped']} skipped")
          EOF
      - name: Verify Room schema baseline
        run: |
          if [ -z "$(git status --porcelain app/schemas)" ]; then
            echo "Room schema matches the committed baseline."
          else
            echo "::error::app/schemas is stale. Regenerate and commit the schema."
            git --no-pager diff --stat app/schemas
            exit 1
          fi
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3

  instrumentation-tests:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # The emulator is by far the slowest step, and it can only be broken by
      # Kotlin, resource, build or CI workflow changes. Documentation and repo
      # metadata edits skip it.
      - name: Decide whether the emulator is needed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base"...HEAD || true)
          echo "Changed files:"; echo "${changed:-<none>}"
          if [ -z "$changed" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping instrumentation tests: nothing changed."
          elif echo "$changed" | grep -qvE '^(docs/|.*\.md$|\.gitattributes$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|dependabot\.yml$|workflows/release\.yml$)|README|LICENSE|SECURITY|CHANGELOG|RELEASES)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping instrumentation tests: no source, build or CI workflow files changed."
          fi

      - name: Enable KVM for the Android emulator
        if: steps.scope.outputs.needed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        if: steps.scope.outputs.needed == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 3
