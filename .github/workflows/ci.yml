name: CI - Build, Test, Lint

on:
  # A pull request already validates its own branch, so pushing to a short-lived
  # branch would run the whole pipeline twice for identical code. Pushes are
  # therefore limited to main, where they act as a post-merge health check.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # ubuntu-latest runners ship the Android SDK (platform 36 is present), so no
      # setup-android step is required; adding one previously failed the job.
      # TEMPORARY probe step (diagnosing the dependency bump failures).
      # Captures the Gradle output so the real error survives into the
      # annotations channel instead of a bare "exit code 1".
      - name: Run unit tests, lint and assemble
        id: gradle
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee gradle-output.log
      - name: Publish Gradle failure details
        if: failure() && steps.gradle.outcome == 'failure'
        run: |
          python3 - <<'EOF'
          import os

          def safe(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          if not os.path.exists("gradle-output.log"):
              raise SystemExit(0)
          lines = [l.rstrip() for l in open("gradle-output.log", encoding="utf-8", errors="replace") if l.strip()]

          # Kotlin/Gradle error lines carry the real diagnosis; the stack trace does not.
          errs = [l for l in lines if l.startswith("e: ") or "What went wrong" in l or l.startswith("FAILURE:")]
          seen, unique = set(), []
          for l in errs:
              if l not in seen:
                  seen.add(l)
                  unique.append(l)
          for i, line in enumerate(unique[:20]):
              print(f"::error title=KERR{i:02d}::{safe(line)}")
          for i, line in enumerate(lines[-10:]):
              print(f"::error title=TAIL{i:02d}::{safe(line)}")
          EOF
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: panther-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Publish the JUnit counts into the job summary for a quick, auditable signal.
      - name: Summarise unit test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, os
          rows, total = [], dict(tests=0, failures=0, errors=0, skipped=0)
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              r = ET.parse(f).getroot()
              d = {k: int(r.get(k, 0)) for k in total}
              for k in total:
                  total[k] += d[k]
              rows.append(f"| {r.get('name')} | {d['tests']} | {d['failures']} | {d['errors']} | {d['skipped']} |")
          out = ["### Unit test results", "", "| Suite | Tests | Failures | Errors | Skipped |", "| --- | --- | --- | --- | --- |"] + rows
          out += ["", f"**Total: {total['tests']} tests, {total['failures']} failures, {total['errors']} errors, {total['skipped']} skipped**"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          print("\n".join(out))
          # Also surfaced as an annotation so the counts are readable from the API.
          print(f"::notice::unit tests executed: {total['tests']} total, {total['failures']} failures, {total['errors']} errors, {total['skipped']} skipped")
          EOF
      - name: Verify Room schema baseline
        run: |
          if [ -z "$(git status --porcelain app/schemas)" ]; then
            echo "Room schema matches the committed baseline."
          else
            echo "::error::app/schemas is stale. Regenerate and commit the schema."
            git --no-pager diff --stat app/schemas
            exit 1
          fi

      - name: Upload Room schema
        uses: actions/upload-artifact@v7
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  instrumentation-tests:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # The emulator is by far the slowest step, and it can only be broken by
      # Kotlin or resource changes. Documentation, assets and workflow edits skip
      # it. Computed with plain git so no third-party action is required.
      - name: Decide whether the emulator is needed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base"...HEAD || true)
          echo "Changed files:"; echo "${changed:-<none>}"
          if [ -z "$changed" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping instrumentation tests: nothing changed."
          elif echo "$changed" | grep -qvE '^(docs/|.*\.md$|\.github/|README|LICENSE|SECURITY|CHANGELOG|RELEASES)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping instrumentation tests: no source or resource files changed."
          fi

      - name: Enable KVM for the Android emulator
        if: steps.scope.outputs.needed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        if: steps.scope.outputs.needed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
