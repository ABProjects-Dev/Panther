name: Clean up old artifacts

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete repository artifacts older than 12 hours
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 12 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            for (const artifact of artifacts) {
              if (!artifact.expired && Date.parse(artifact.created_at) <= cutoff) {
                core.info(`Deleting ${artifact.name} (id ${artifact.id}, created ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              }
            }
