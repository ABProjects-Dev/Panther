name: Release Official APK

on:
  push:
    tags:
      - 'v*.*.*' # Semantic Versioning: v1.0.0, v1.1.0, ...
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (must match v*.*.*)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG does not match Semantic Versioning format vX.Y.Z"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          # versionCode must be monotonically increasing: MAJOR*10000 + MINOR*100 + PATCH
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "version_code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG is valid."

  build-and-sign-release:
    name: Build and sign release APK
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.validate-tag.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode signing material
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          chmod 600 app/release.jks
          umask 077
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/signing.properties
      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease -PreleaseVersionName="$RELEASE_VERSION_NAME" -PreleaseVersionCode="$RELEASE_VERSION_CODE" --stacktrace
      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "::error::No release APK produced"; exit 1; fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -n 1)
          "$AAPT" dump badging "$APK_PATH" | grep -E "package:|versionCode:|versionName:"
          jarsigner -verify -verbose -certs "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: panther-official-release-${{ needs.validate-tag.outputs.tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    needs: [ validate-tag, build-and-sign-release ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: panther-official-release-${{ needs.validate-tag.outputs.tag }}
          path: release-artifacts
      - name: Create release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: Panther Release ${{ needs.validate-tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          append_body: true
          body: |
            Official release of Panther.
            Version: ${{ needs.validate-tag.outputs.version }}
            Build date: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          files: release-artifacts/*.apk
