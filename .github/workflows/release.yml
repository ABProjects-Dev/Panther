name: Release Official APK

on:
  push:
    tags:
      - 'v*.*.*' # Semantic Versioning: v1.0.0, v1.1.0, ...
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (must match v*.*.*)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag format and ancestry
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve and validate tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG does not match Semantic Versioning format vX.Y.Z"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::MINOR ($MINOR) and PATCH ($PATCH) must be in 0..99 to keep versionCode monotonic."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::Tag $TAG does not exist in the repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" refs/remotes/origin/main; then
            echo "::error::Tag $TAG is not on origin/main. Official releases must be tagged from main."
            exit 1
          fi
          # versionCode must be monotonically increasing: MAJOR*10000 + MINOR*100 + PATCH
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "version_code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG is valid and verified as an ancestor of origin/main."

  build-and-sign-release:
    name: Build and sign release APK
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.validate-tag.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.validate-tag.outputs.tag }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run unit tests and lint quality gate
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required_secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required_secret:-}" ]; then
              echo "::error::Required signing secret $required_secret is not configured"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          chmod 600 app/release.jks
      - name: Assemble signed release APK
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreleaseVersionName="$RELEASE_VERSION_NAME" -PreleaseVersionCode="$RELEASE_VERSION_CODE" --stacktrace
      - name: Cleanup signing material
        if: always()
        run: rm -f app/release.jks app/signing.properties
      - name: Verify signed APK and generate SHA-256 checksum
        run: |
          set -euo pipefail
          APK_BASENAME="Panther V${RELEASE_VERSION_NAME}.apk"
          APK_PATH="app/build/outputs/apk/release/${APK_BASENAME}"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected signed release APK not found at: $APK_PATH"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK_PATH" | grep -E "package:|versionCode:|versionName:"
          "$APKSIGNER" verify --verbose --min-sdk-version 26 --print-certs "$APK_PATH"
          (
            cd app/build/outputs/apk/release
            sha256sum "$APK_BASENAME" > "${APK_BASENAME}.sha256"
            sha256sum --check "${APK_BASENAME}.sha256"
          )
          cat "${APK_PATH}.sha256"
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: panther-official-release-${{ needs.validate-tag.outputs.tag }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    needs: [ validate-tag, build-and-sign-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
      RELEASE_VERSION_NAME: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare release body from Persian tag annotation
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_TYPE=$(git cat-file -t "refs/tags/${RELEASE_TAG}" || true)
          TAG_MESSAGE=""
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_MESSAGE=$(git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)')
          fi
          {
            if [ -n "$TAG_MESSAGE" ]; then
              printf '<div dir="rtl">\n\n%s\n\n</div>\n\n---\n\n' "$TAG_MESSAGE"
            fi
            printf 'Official release of **Panther V%s** (`%s`).\n' "$RELEASE_VERSION_NAME" "$RELEASE_TAG"
            printf 'APK filename: `Panther V%s.apk`\n' "$RELEASE_VERSION_NAME"
          } > release-body.md
      - name: Download signed APK and checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: panther-official-release-${{ needs.validate-tag.outputs.tag }}
          path: release-artifacts
      - name: Verify checksum before release attachment
        run: |
          set -euo pipefail
          cd release-artifacts
          APK_BASENAME="Panther V${RELEASE_VERSION_NAME}.apk"
          if [ ! -f "$APK_BASENAME" ]; then
            echo "::error::Expected APK '${APK_BASENAME}' not found in release-artifacts"
            ls -la
            exit 1
          fi
          sha256sum --check "${APK_BASENAME}.sha256"
      - name: Publish GitHub Release and attach artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: Panther V${{ needs.validate-tag.outputs.version }}
          draft: false
          prerelease: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          body_path: release-body.md
          files: |
            release-artifacts/*.apk
            release-artifacts/*.apk.sha256
