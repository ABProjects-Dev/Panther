version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Ten concurrent dependency pull requests each started a full CI run, which
    # is what made the pipeline feel slow. Three at a time keeps the queue short.
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns:
          - "androidx.*"
      # Tooling bumps ship together as one reviewable change instead of one pull
      # request per library.
      gradle-tooling:
        patterns:
          - "com.android.tools.build"
          - "org.jetbrains.kotlin*"
          - "com.google.dagger*"
          - "ksp"
      test-libraries:
        patterns:
          - "junit*"
          - "org.json*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Action bumps are mechanical and verified by CI, so batch them.
      github-actions:
        patterns:
          - "*"
